# Harrier: intrusion detection with an AI investigator.
# First time: ./setup.sh   (writes .env, finds or starts Ollama, creates your admin account)
# After that: docker compose up -d
#
# Optional pieces are switched on from .env by setup.sh:
#   COMPOSE_PROFILES=ollama                  run the bundled Ollama (only if none is running already)
#   COMPOSE_FILE=...:compose.gpu.yml         give the bundled Ollama your NVIDIA GPU
#   COMPOSE_FILE=...:compose.network.yml     join an existing Docker network (to reach your own Ollama / Pi-hole)

services:
  postgres:
    image: postgres:17-alpine
    container_name: harrier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harrier
      POSTGRES_USER: harrier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"   # loopback only: for the guard and flow recorder
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harrier -d harrier"]
      interval: 5s
      timeout: 5s
      retries: 20

  harrier:
    build: .
    image: harrier:${HARRIER_VERSION:-1.0.1}
    container_name: harrier
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://harrier:${POSTGRES_PASSWORD}@postgres:5432/harrier
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "${HARRIER_PORT:-8095}:8095/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an Ollama running directly on this machine
    volumes:
      - ${HOST_LOG_DIR:-/var/log}:/logs/host:ro              # auth.log (SSH), ufw.log (firewall)
      - ${CADDY_LOG_DIR:-./data/no-caddy}:/logs/caddy:ro     # Caddy JSON access log (optional)
      - ${KESTREL_DATA_DIR:-./data/no-kestrel}:/logs/kestrel # Kestrel's verdicts (optional). Opened read-only, but SQLite needs its -shm file writable
    depends_on:
      postgres:
        condition: service_healthy

  # Applies blocks to the host firewall. Separate on purpose: no AI, no web, no attacker text here.
  guard:
    image: harrier:${HARRIER_VERSION:-1.0.1}
    container_name: harrier-guard
    restart: unless-stopped
    command: ["python", "guard.py"]
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      DATABASE_URL: postgresql://harrier:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT:-5433}/harrier
      ALLOW: ${ALLOW:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Records connections in and out of this machine (host, containers, VPN) from conntrack.
  flows:
    image: harrier:${HARRIER_VERSION:-1.0.1}
    container_name: harrier-flows
    restart: unless-stopped
    command: ["python", "flows.py"]
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      DATABASE_URL: postgresql://harrier:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT:-5433}/harrier
    depends_on:
      postgres:
        condition: service_healthy

  # Bundled Ollama, only started with COMPOSE_PROFILES=ollama (setup.sh does this when it finds no Ollama).
  ollama:
    image: ollama/ollama:0.40.13
    container_name: harrier-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ./data/ollama:/root/.ollama
